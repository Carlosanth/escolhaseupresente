<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obrigado pelo presente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0820; --bg2:#1b1042; --violet:#7c3aed; --lilac:#a78bfa;
  --gold:#f5d98b; --cream:#fff3d0; --text:#d9ceff; --muted:#a498d0;
}
*{box-sizing:border-box;margin:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  background:
    radial-gradient(60% 50% at 50% 38%, rgba(124,58,237,.35), transparent 70%),
    radial-gradient(40% 40% at 85% 90%, rgba(245,217,139,.07), transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg) 70%);
  color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;overflow-x:hidden;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.stars i{
  position:absolute;border-radius:50%;background:var(--c,var(--gold));
  box-shadow:0 0 8px 1px var(--c,var(--gold));
  opacity:0;
  animation:drift var(--t,20s) ease-in-out var(--d,0s) infinite alternate,
            twinkle var(--k,4s) ease-in-out var(--d,0s) infinite;
}
@keyframes drift{
  0%{transform:translate(0,0)}
  33%{transform:translate(var(--x1),var(--y1))}
  66%{transform:translate(var(--x2),var(--y2))}
  100%{transform:translate(var(--x3),var(--y3))}
}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.85}}

main{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.brand{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--text);
  padding:7px 14px 7px 8px;border-radius:999px;
  background:rgba(124,58,237,.14);border:1px solid rgba(167,139,250,.25);
  margin-bottom:36px;opacity:0;animation:fade .8s .2s forwards;
}
.brand svg{width:22px;height:22px}

.gift{width:150px;cursor:pointer;margin-bottom:28px;-webkit-tap-highlight-color:transparent;overflow:visible}
.gift:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:12px}
.lid{transform-box:fill-box;transform-origin:20% 100%}
.glow{opacity:0}
.gift.open .lid{animation:open 1.1s cubic-bezier(.3,1.5,.5,1) forwards}
.gift.open .glow{animation:glow 1.4s ease-out forwards}
.gift.closing .lid{animation:close .7s cubic-bezier(.6,0,.3,1.25) forwards}
.gift.closing .glow{animation:unglow .5s ease-in forwards}
@keyframes open{to{transform:translate(8px,-30px) rotate(-14deg)}}
@keyframes close{from{transform:translate(8px,-30px) rotate(-14deg)}to{transform:none}}
@keyframes glow{40%{opacity:1}100%{opacity:.55}}
@keyframes unglow{from{opacity:.55}to{opacity:0}}

h1{
  font-family:"Playfair Display",serif;font-style:italic;font-weight:600;
  font-size:clamp(40px,8vw,72px);line-height:1.2;padding:.04em .06em .14em;letter-spacing:-.01em;
  background:linear-gradient(180deg,var(--cream) 30%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:rise 1s 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}
.sub{
  margin-top:18px;font-size:clamp(17px,2.6vw,21px);font-weight:500;color:var(--text);
  opacity:0;animation:fade 1s 1.5s forwards;
}
.note{
  margin-top:12px;max-width:34ch;font-size:15px;line-height:1.6;color:var(--muted);
  opacity:0;animation:fade 1s 1.8s forwards;
}
.btn{
  margin-top:30px;display:inline-block;text-decoration:none;
  padding:14px 28px;border-radius:999px;font-weight:600;font-size:15px;color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6d3df0);
  box-shadow:0 8px 28px rgba(124,58,237,.45);
  opacity:0;animation:fade 1s 2.1s forwards;transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(124,58,237,.6)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn[hidden]{display:none}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1{text-wrap:balance}
.note{text-wrap:balance}
@media (max-width:600px){
  .brand{margin-bottom:28px;font-size:12px}
  .gift{width:118px;margin-bottom:22px}
  .sub{margin-top:14px}
  .note{font-size:14px;max-width:28ch}
  .btn{width:100%;max-width:320px;text-align:center;padding:15px 24px;margin-top:26px}
}
@media (max-height:520px) and (orientation:landscape){
  body{align-items:start}
  main{padding:8px 0}
  .brand{margin-bottom:14px}
  .gift{width:80px;margin-bottom:12px}
  h1{font-size:clamp(30px,6vw,44px)}
  .btn{margin-top:16px;padding:11px 22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important}
  .stars i{opacity:.4;animation:none}
  canvas{display:none}
}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<canvas id="c" aria-hidden="true"></canvas>

<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="#7c3aed"/><path d="M6.5 11h11v6.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1V11Zm-1-3h13v3h-13V8Zm6.5 0v10.5M12 8c-1.5-3-4.5-2.5-4 0m4 0c1.5-3 4.5-2.5 4 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Escolha Seu Presente
  </div>

  <svg class="gift" id="gift" viewBox="0 0 160 150" role="button" tabindex="0" aria-label="Abrir o presente de novo">
    <defs>
      <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b2bd0"/></linearGradient>
      <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d3df0"/></linearGradient>
      <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d0"/><stop offset="1" stop-color="#f0c75e"/></linearGradient>
      <radialGradient id="gg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse class="glow" cx="80" cy="66" rx="62" ry="34" fill="url(#gg)"/>
    <rect x="28" y="66" width="104" height="76" rx="8" fill="url(#gb)"/>
    <rect x="72" y="66" width="16" height="76" fill="url(#gr)"/>
    <g class="lid">
      <rect x="20" y="48" width="120" height="24" rx="7" fill="url(#gl)"/>
      <rect x="72" y="48" width="16" height="24" fill="url(#gr)"/>
      <path d="M80 48C66 20 38 26 48 42c5 7 22 6 32 6Zm0 0c14-28 42-22 32-6-5 7-22 6-32 6Z" fill="url(#gr)"/>
      <circle cx="80" cy="46" r="6" fill="#f0c75e"/>
    </g>
  </svg>

  <h1>Obrigado pelo presente</h1>
  <p class="sub">Ficamos muito agradecidos.</p>
  <p class="note">Seu carinho faz toda a diferença para nós. Que tal avisar que deu tudo certo?</p>
  <!-- Troque o href pelo link do WhatsApp do dono da lista (ex.: https://wa.me/55DDDNUMERO). Se ficar "#", o botão some. -->
  <a class="btn" id="msg" href="#">Enviar uma mensagem</a>
</main>

<script>
(function(){
  // bolinhas douradas e lilás flutuando pela tela
  var st=document.getElementById('stars');
  var cols=['#f5d98b','#f5d98b','#fff3d0','#a78bfa'];
  var n=innerWidth<600?26:44;
  function r(m){return ((Math.random()*2-1)*m).toFixed(0)}
  for(var i=0;i<n;i++){
    var s=document.createElement('i'),z=2+Math.random()*3.5;
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.width=s.style.height=z+'px';
    s.style.setProperty('--c',cols[(Math.random()*cols.length)|0]);
    s.style.setProperty('--t',(16+Math.random()*20)+'s');
    s.style.setProperty('--k',(3+Math.random()*4)+'s');
    s.style.setProperty('--d',(-Math.random()*20)+'s');
    for(var j=1;j<=3;j++){
      s.style.setProperty('--x'+j,r(j*9+12)+'vw');
      s.style.setProperty('--y'+j,r(j*9+12)+'vh');
    }
    st.appendChild(s);
  }
  var msg=document.getElementById('msg');
  if(msg.getAttribute('href')==='#')msg.hidden=true;

  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;

  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2);
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);

  var colors=['#f5d98b','#fff3d0','#a78bfa','#8b5cf6','#34d399','#f9a8d4'];
  var parts=[],running=false;

  function burst(n){
    var g=document.getElementById('gift').getBoundingClientRect();
    var ox=g.left+g.width/2,oy=g.top+g.height*.3;
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+(Math.random()-.5)*Math.PI*.95,v=7+Math.random()*10;
      parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,
        c:colors[(Math.random()*colors.length)|0],round:Math.random()>.75,life:1,wob:Math.random()*6});
    }
    if(!running){running=true;requestAnimationFrame(tick)}
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=.22;p.vx*=.985;p.vy*=.985;
      p.wob+=.08;p.x+=p.vx+Math.sin(p.wob)*.6;p.y+=p.vy;p.r+=p.vr;
      if(p.vy>0)p.life-=.006;
      if(p.life<=0||p.y>H+20){parts.splice(i,1);continue}
      ctx.save();ctx.globalAlpha=Math.max(p.life,0);ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.w/2.4,0,6.3);ctx.fill()}
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(parts.length)requestAnimationFrame(tick);else{running=false;closeGift()}
  }

  // explosão quando a tampa abre + uma segunda rajada suave
  var gift=document.getElementById('gift');
  function openGift(){
    gift.classList.remove('open','closing');void gift.getBoundingClientRect();gift.classList.add('open');
  }
  function closeGift(){
    gift.classList.remove('open');gift.classList.add('closing');
  }
  window.__closeGift=closeGift;
  setTimeout(openGift,500);
  setTimeout(function(){burst(110)},700);
  setTimeout(function(){burst(50)},1300);

  function again(){
    openGift();
    setTimeout(function(){burst(90)},200);
  }
  gift.addEventListener('click',again);
  gift.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();again()}});
})();
</script>
</body>
</html>
